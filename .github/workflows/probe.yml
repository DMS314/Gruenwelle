name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for O in '"alternates":2' '"costing_options":{"auto":{"shortest":true}}' '"costing_options":{"auto":{"use_highways":0}},"alternates":1' '"costing_options":{"auto":{"use_highways":1.0,"use_living_streets":0,"use_tracks":0}}'; do
          echo "== $O"
          curl -s -m 40 "https://valhalla1.openstreetmap.de/route" -H 'Content-Type: application/json' -d '{"locations":[{"lat":51.3254,"lon":12.435},{"lat":51.3451,"lon":12.3822}],"costing":"auto",'"$O"',"format":"osrm","shape_format":"geojson","units":"km","language":"de-DE"}' > o.json
          python3 - <<'P'
          import json;j=json.load(open('o.json'));rs=j.get('routes') or [];print('code',j.get('code'),'routes',len(rs),j.get('message',''))
          for r in rs:
            st=r['legs'][0]['steps'];g=r['geometry'];print(' dist',round(r['distance']),'dur',round(r['duration']),'geom',g['type'] if isinstance(g,dict) else type(g),len(g['coordinates']) if isinstance(g,dict) else '', 'steps',len(st))
            nl=sum(1 for s in st for it in s.get('intersections',[]) if it.get('lanes'));print(' intersections with lanes',nl,'types',sorted({s['maneuver']['type']+'/'+str(s['maneuver'].get('modifier')) for s in st})[:12])
            print(' step0',{k:st[1].get(k) for k in ('name','distance','duration','mode','ref')},st[1]['maneuver'])
          P
          done
