name: Probe Autobahn-API (temporär)
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CORS-Header und Beispieldaten
        run: |
          for ep in warning closure; do
            echo "== $ep =="
            curl -s -D - -o /tmp/$ep.json -H "Origin: https://dms314.github.io" "https://verkehr.autobahn.de/o/autobahn/A14/services/$ep" | grep -i -E "^HTTP|access-control|cache-control|content-type"
            python3 -c "
          import json;d=json.load(open('/tmp/$ep.json'));k=[x for x in d if isinstance(d[x],list)][0];L=d[k];print(k,len(L))
          for x in L[:2]:print(json.dumps({a:x.get(a) for a in ['identifier','title','subtitle','description','abnormalTrafficType','delayTimeValue','averageSpeed','startTimestamp','display_type','isBlocked','extent']},ensure_ascii=False)[:900]);print('Schlüssel:',sorted(x.keys()))"
          done
          echo "== preflight =="; curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://dms314.github.io" -H "Access-Control-Request-Method: GET" "https://verkehr.autobahn.de/o/autobahn/A9/services/warning" | grep -i -E "^HTTP|access-control"
          for r in A4 A9 A13 A14 A17 A38 A72 A143; do n=$(curl -s "https://verkehr.autobahn.de/o/autobahn/$r/services/warning" | python3 -c "import json,sys;print(len(json.load(sys.stdin).get('warning',[])))"); echo "$r Warnungen: $n"; done
