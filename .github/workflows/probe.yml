name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
          curl -s -m 40 -w "\nZEIT %{time_total}\n" "https://valhalla1.openstreetmap.de/route" -H 'Content-Type: application/json' -d '{"locations":[{"lat":51.3254,"lon":12.435,"heading":20,"heading_tolerance":45},{"lat":51.3451,"lon":12.3822}],"costing":"auto","alternates":2,"exclude_polygons":[[[12.40,51.33],[12.41,51.33],[12.41,51.34],[12.40,51.34],[12.40,51.33]]],"format":"osrm","shape_format":"geojson","language":"de-DE"}' > o.json; tail -1 o.json; head -n -1 o.json > p.json
          python3 -c "
          import json;j=json.load(open('p.json'));rs=j.get('routes') or [];print('routes',len(rs),j.get('message',''))
          r=rs[0];L=[it for s in r['legs'][0]['steps'] for it in s.get('intersections',[]) if it.get('lanes')];print(json.dumps(L[0],ensure_ascii=False)[:500]);print('classes',{c for s in r['legs'][0]['steps'] for it in s.get('intersections',[]) for c in it.get('classes',[])})"
          done
          echo == bicycle; curl -s -m 40 "https://valhalla1.openstreetmap.de/route" -H 'Content-Type: application/json' -d '{"locations":[{"lat":51.3254,"lon":12.435},{"lat":51.3451,"lon":12.3822}],"costing":"bicycle","alternates":2,"format":"osrm","shape_format":"geojson"}' | python3 -c "import json,sys;j=json.load(sys.stdin);print([(round(r['distance']),round(r['duration'])) for r in j.get('routes',[])])"
          echo == motorway classes; curl -s -m 40 "https://valhalla1.openstreetmap.de/route" -H 'Content-Type: application/json' -d '{"locations":[{"lat":51.30,"lon":12.37},{"lat":51.40,"lon":12.47}],"costing":"auto","format":"osrm","shape_format":"geojson"}' | python3 -c "
          import json,sys;j=json.load(sys.stdin);r=j['routes'][0];print({c for s in r['legs'][0]['steps'] for it in s.get('intersections',[]) for c in it.get('classes',[])});print([(s['name'],s.get('ref'),round(s['distance'])) for s in r['legs'][0]['steps']][:12])"
