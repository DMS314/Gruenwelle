name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 -D h1 -H 'Origin: https://dms314.github.io' -o poly.json "https://geodienste.leipzig.de/l3/OpenData/wfs?VERSION=1.3.0&REQUEST=getFeature&typeName=OpenData%3Averkehrsraumeinschraenkungen&outputFormat=application/json&srsName=EPSG:4326"; grep -i "^HTTP\|access-control\|content-type\|content-length" h1
          curl -s -m 60 -o pt.json "https://geodienste.leipzig.de/l3/OpenData/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=OpenData%3AVerkehrsraumeinschraenkungen_point&outputFormat=application%2Fjson&srsName=EPSG:4326"
          curl -s -m 30 "https://opendata.leipzig.de/api/3/action/package_show?id=verkehrsraumeinschrankungen-polygone-stadt-leipzig" | python3 -c "import json,sys;r=json.load(sys.stdin)['result'];print('LIZENZ',r.get('license_title'),r.get('license_id'))"
          python3 - <<'P'
          import json
          from collections import Counter
          for fn in ['poly.json','pt.json']:
              try:j=json.load(open(fn))
              except Exception as e:print(fn,'FEHLER',open(fn).read()[:300]);continue
              F=j.get('features',[]);print('==',fn,len(F),'crs',j.get('crs'))
              if not F:continue
              print('Felder',list(F[0]['properties'].keys()))
              print('Geom',Counter(f['geometry']['type'] for f in F if f.get('geometry')))
              print('Beispiel',json.dumps(F[0]['properties'],ensure_ascii=False)[:700])
              for k in F[0]['properties']:
                  c=Counter(str(f['properties'].get(k))[:40] for f in F)
                  if len(c)<25:print(' ',k,c.most_common(12))
              hits=[f for f in F if any(s in json.dumps(f['properties'],ensure_ascii=False) for s in ['Brahe','Stöhrer'])]
              print('TREFFER',len(hits))
              for f in hits[:5]:
                  g=f['geometry'];c=g['coordinates']
                  while isinstance(c[0],list):c=c[0]
                  print(json.dumps(f['properties'],ensure_ascii=False)[:900],g['type'],c[:2])
          P
