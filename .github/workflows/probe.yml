name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse
          q='[out:json][timeout:60];way["highway"]["name"~"^(Stöhrerstraße|Brahestraße|Braunstraße|Föpplstraße)$"](51.355,12.42,51.375,12.45);out body geom;'
          r=json.load(urllib.request.urlopen(urllib.request.Request('https://maps.mail.ru/osm/tools/overpass/api/interpreter',data=urllib.parse.urlencode({'data':q}).encode()),timeout=90))
          nodes={}
          for w in r['elements']:
              nm=w['tags']['name'];g=w['geometry'];print(nm,w['id'],w['tags'].get('highway'),'von',(round(g[0]['lat'],5),round(g[0]['lon'],5)),'bis',(round(g[-1]['lat'],5),round(g[-1]['lon'],5)))
              for nid,p in zip(w['nodes'],g):nodes.setdefault(nm,{})[nid]=(round(p['lat'],6),round(p['lon'],6))
          for a,b in [('Stöhrerstraße','Brahestraße'),('Stöhrerstraße','Braunstraße'),('Brahestraße','Föpplstraße')]:
              print(a,b,'gemeinsame Knoten',[nodes[a][k] for k in nodes.get(a,{}).keys()&nodes.get(b,{}).keys()])
          P
