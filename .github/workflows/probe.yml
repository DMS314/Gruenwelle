name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import json,math,urllib.request,urllib.parse
          def d(a,b):return math.hypot((a[0]-b[0])*69600,(a[1]-b[1])*111000)
          # 1) Parkplatz wie in der App wählen
          A='(around:%d,51.348590,12.478890)'
          q='[out:json][timeout:25];(way[amenity=parking]'+A%400+';relation[amenity=parking]'+A%400+';node[amenity=parking_entrance]'+A%450+';);out geom;'
          o=json.load(urllib.request.urlopen(urllib.request.Request('https://maps.mail.ru/osm/tools/overpass/api/interpreter',data=urllib.parse.urlencode({'data':q}).encode()),timeout=90))
          def area(r):
              o0=r[0];a=0
              for i in range(1,len(r)-1):
                  x1=(r[i][0]-o0[0])*69600;y1=(r[i][1]-o0[1])*111000;x2=(r[i+1][0]-o0[0])*69600;y2=(r[i+1][1]-o0[1])*111000;a+=x1*y2-x2*y1
              return abs(a)/2
          L=[]
          for e in o['elements']:
              t=e.get('tags',{})
              if e['type']=='node' or t.get('amenity')!='parking':continue
              if t.get('access','') in ('private','no','delivery','permit','employees') or t.get('parking','') in ('street_side','lane','on_street'):continue
              r=[(g['lon'],g['lat']) for g in (e.get('geometry') or [m2 for m in e.get('members',[]) for m2 in m.get('geometry',[])])]
              if len(r)<3:continue
              a=area(r)*(1.5 if t.get('parking')=='multi-storey' else 1);L.append((a,e['id'],t.get('name'),t.get('parking'),t.get('access'),r))
          L.sort(reverse=True)
          for a,i,n,p,acc,r in L[:4]:print('PARK',round(a),'m²',i,n,p,acc,'Mitte',round(sum(x[1] for x in r)/len(r),5),round(sum(x[0] for x in r)/len(r),5))
          best=L[0][5];ents=[e for e in o['elements'] if e['type']=='node']
          def segd(p,a,b):
              bx,by=(b[0]-a[0])*69600,(b[1]-a[1])*111000;px,py=(p[0]-a[0])*69600,(p[1]-a[1])*111000;Lq=bx*bx+by*by;t=max(0,min(1,(px*bx+py*by)/Lq)) if Lq else 0;return math.hypot(px-t*bx,py-t*by)
          for e in ents:
              dd=min(segd((e['lon'],e['lat']),best[i],best[i+1]) for i in range(len(best)-1))
              if dd<40:print('EINFAHRT',e['id'],e['lat'],e['lon'],round(dd),'m')
          # 2) Route 14:17 mit Sperrflächen der Autobahnrampen
          C=json.load(open('closures.json'))['items'];bl=[i for i in C if i.get('blocked') and 'Messe' in i['title']]
          sq=[]
          for i in bl:
              pick=[]
              for p in i['poly']:
                  if not any(d(p,q)<30 for q in pick):pick.append(p)
              sq+= [[[p[0]-.00017,p[1]-.00011],[p[0]+.00017,p[1]-.00011],[p[0]+.00017,p[1]+.00011],[p[0]-.00017,p[1]+.00011],[p[0]-.00017,p[1]-.00011]] for p in pick]
          def run(ex):
              b={'locations':[{'lat':51.40215,'lon':12.4549},{'lat':51.3501,'lon':12.4756}],'costing':'auto','format':'osrm','shape_format':'geojson','language':'de-DE'}
              if ex:b['exclude_polygons']=ex
              r=json.load(urllib.request.urlopen('https://valhalla1.openstreetmap.de/route?json='+urllib.parse.quote(json.dumps(b)),timeout=60))['routes'][0]
              g=r['geometry']['coordinates'];near=min(d(p,q) for i in bl for p in i['poly'] for q in g)
              return round(r['distance']),round(r['duration']),round(near),[s['name'] or s.get('ref','') for s in r['legs'][0]['steps']][:12]
          print('ROUTE ohne Sperrdaten',run(None));print('ROUTE mit Sperrdaten ',run(sq))
          P
