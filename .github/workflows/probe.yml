name: Probe Tempolimit live (temporär)
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe.yml, .github/probe/live.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 2 && timeout 400 python3 -u .github/probe/live.py
