name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import json,math,urllib.request,urllib.parse
          C=[i for i in json.load(open('closures.json'))['items'] if 'Brahe' in i['title']][0];poly=C['poly']
          def d(a,b):return math.hypot((a[0]-b[0])*69600,(a[1]-b[1])*111000)
          def run(A,B,excl):
              body={'locations':[{'lat':A[1],'lon':A[0]},{'lat':B[1],'lon':B[0]}],'costing':'auto','format':'osrm','shape_format':'geojson','language':'de-DE','alternates':2}
              if excl:body['exclude_polygons']=excl
              j=json.load(urllib.request.urlopen('https://valhalla1.openstreetmap.de/route?json='+urllib.parse.quote(json.dumps(body)),timeout=60))
              out=[]
              for r in j['routes']:
                  g=r['geometry']['coordinates'];near=min(d(p,q) for p in poly for q in g)
                  out.append((round(r['distance']),round(r['duration']),round(near,1),[s['name'] for s in r['legs'][0]['steps'] if s['name']][:9]))
              return out
          pick=[]
          for p in poly:
              if not any(d(p,q)<30 for q in pick):pick.append(p)
          sq=[[[p[0]-.00017,p[1]-.00011],[p[0]+.00017,p[1]-.00011],[p[0]+.00017,p[1]+.00011],[p[0]-.00017,p[1]+.00011],[p[0]-.00017,p[1]-.00011]] for p in pick]
          A=(12.43896,51.39296);B=(12.4154,51.31948)
          for x in run(A,B,None):print('ohne Sperrdaten',x)
          for x in run(A,B,sq):print('mit Sperrdaten ',x)
          P
