name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse,math
          body={'locations':[{'lat':51.3400,'lon':12.4452},{'lat':51.35988,'lon':12.444009}],'costing':'auto','format':'osrm','shape_format':'geojson','language':'de-DE'}
          j=json.load(urllib.request.urlopen('https://valhalla1.openstreetmap.de/route?json='+urllib.parse.quote(json.dumps(body)),timeout=60))
          r=j['routes'][0]
          for s in r['legs'][0]['steps']:
              print('STEP',s['maneuver']['type'],s['maneuver'].get('modifier'),s['name'],round(s['distance']))
              for it in s.get('intersections',[]):
                  lo,la=it['location']
                  if 51.343<la<51.352:print('   INT',round(la,6),round(lo,6),'lanes',[(l['indications'],l['valid']) for l in it.get('lanes',[])])
          q='[out:json][timeout:60];way(51.3440,12.4440,51.3500,12.4470)[highway~"primary|secondary|tertiary|trunk"];out tags geom;'
          o=json.load(urllib.request.urlopen(urllib.request.Request('https://maps.mail.ru/osm/tools/overpass/api/interpreter',data=urllib.parse.urlencode({'data':q}).encode()),timeout=90))
          for w in o['elements']:
              t=w['tags'];g=w['geometry']
              print('WAY',w['id'],t.get('name'),'| oneway',t.get('oneway'),'| lanes',t.get('lanes'),'| fwd',t.get('lanes:forward'),'| turn',t.get('turn:lanes'),'| turnF',t.get('turn:lanes:forward'),'| von',(round(g[0]['lat'],5),round(g[0]['lon'],5)),'bis',(round(g[-1]['lat'],5),round(g[-1]['lon'],5)))
          P
