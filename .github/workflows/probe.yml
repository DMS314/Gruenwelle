name: Probe Blitzer-Richtungen (temporär)
on:
  push:
    branches: [main]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Richtungsangaben der Blitzer
        run: |
          Q='[out:json][timeout:120];node["highway"="speed_camera"](51.20,12.15,51.48,12.62)->.c;.c out body;way(bn.c)[highway];out tags geom;rel(bn.c)[type=enforcement]->.r;.r out body;node(r.r)->.m;.m out skel;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do curl -sS --max-time 180 -o p.json --data-urlencode "data=$Q" "$u" && python3 -c "import json;json.load(open('p.json'))" && break; done
          python3 - <<'P'
          import json,collections
          E=json.load(open('p.json'))['elements']
          cams=[e for e in E if e['type']=='node' and e.get('tags',{}).get('highway')=='speed_camera']
          ways=[e for e in E if e['type']=='way'];rels=[e for e in E if e['type']=='relation']
          onway={n for w in ways for n in w.get('nodes',[])}
          print('Blitzer',len(cams),'auf Straße',sum(c['id'] in onway for c in cams),'Relationen',len(rels))
          print('direction-Tags',collections.Counter(c['tags'].get('direction','—') for c in cams))
          print('andere Richtungstags',[ (c['id'],{k:v for k,v in c['tags'].items() if 'dir' in k or 'side' in k}) for c in cams if any('dir' in k or 'side' in k for k in c['tags']) and 'direction' not in c['tags']][:10])
          inrel=collections.Counter()
          for r in rels:
            roles=collections.Counter(m['role'] for m in r['members']);print('Rel',r['id'],r['tags'].get('enforcement'),dict(roles),r['tags'].get('direction',''))
            for m in r['members']:
              if m['role']=='device':inrel[m['ref']]+=1
          import math
          N={}
          for e in E:
            if e['type']=='node' and (e['id'] not in N or e.get('tags')):N[e['id']]=e
          def brg(a,b):
            y=math.sin(math.radians(b['lon']-a['lon']))*math.cos(math.radians(b['lat']));x=math.cos(math.radians(a['lat']))*math.sin(math.radians(b['lat']))-math.sin(math.radians(a['lat']))*math.cos(math.radians(b['lat']))*math.cos(math.radians(b['lon']-a['lon']))
            return (math.degrees(math.atan2(y,x))+360)%360
          diffs=[]
          for r in rels:
            m={x['role']:x['ref'] for x in r['members']}
            if not all(k in m for k in('device','from','to')):continue
            d=N.get(m['device']);f=N.get(m['from']);t=N.get(m['to'])
            if not(d and f and t):continue
            tb=brg(f,t);tag=d.get('tags',{}).get('direction','')
            for v in tag.split(';'):
              try:dv=float(v)
              except:continue
              diffs.append(round(((dv-tb+540)%360)-180))
            dt=((brg(d,t)-tb+540)%360)-180
            print('Rel',r['id'],r['tags'].get('enforcement'),'Fahrt',round(tb),'Tag',tag,'Abstand Gerät-Messpunkt',round(math.hypot((d['lat']-t['lat'])*111000,(d['lon']-t['lon'])*70000)),'m')
          print('DIFFS',sorted(diffs))
          print('Blitzer in Relation',sum(c['id'] in inrel for c in cams))
          print('Beispiele Tags',[c['tags'] for c in cams[:6]])
          P
