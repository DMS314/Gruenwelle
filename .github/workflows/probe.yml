name: probe
on: {push: {paths: ['.github/workflows/probe.yml']}, workflow_dispatch: {}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse,math
          UA={'User-Agent':'Gruenwelle/1.0 (+https://github.com/DMS314/Gruenwelle)'}
          try:
              j=json.load(urllib.request.urlopen(urllib.request.Request('https://photon.komoot.io/api/?q=Paunsdorf%20Center&lat=51.34&lon=12.45&limit=3&lang=de',headers=UA),timeout=30))
              for f in j['features']:print('PHOTON',f['properties'].get('name'),f['properties'].get('osm_key'),f['properties'].get('osm_value'),f['properties'].get('osm_type'),f['properties'].get('osm_id'),f['geometry']['coordinates'],f['properties'].get('extent'))
          except Exception as e:print('photon err',e)
          q='[out:json][timeout:60];(nwr[amenity=parking](51.3440,12.4680,51.3540,12.4840);node[amenity=parking_entrance](51.3440,12.4680,51.3540,12.4840);nwr[name~"Paunsdorf"][shop](51.34,12.46,51.36,12.49););out tags center;'
          o=json.load(urllib.request.urlopen(urllib.request.Request('https://maps.mail.ru/osm/tools/overpass/api/interpreter',data=urllib.parse.urlencode({'data':q}).encode()),timeout=90))
          for e in o['elements']:
              c=e.get('center') or {'lat':e.get('lat'),'lon':e.get('lon')}
              t=e['tags'];print('OSM',e['type'],e['id'],round(c['lat'],5),round(c['lon'],5),{k:t[k] for k in t if k in('amenity','name','parking','capacity','access','shop','fee','operator','parking_entrance','building')})
          P
