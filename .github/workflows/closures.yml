name: Sperrungen Leipzig

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/closures.yml
      - tools/build_closures.py
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sperrungen
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verkehrsraumeinschränkungen der Stadt Leipzig laden
        run: python3 tools/build_closures.py closures.json
      - name: Committen, wenn sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add closures.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Sperrungen Leipzig aktualisiert"
          git pull --rebase -q && git push
