name: Ampeldaten Leipzig

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ampeln.yml
      - tools/build_signals.py
      - tools/fetch_signals.sh
      - tools/build_cameras.py
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ampeldaten
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BBOX: 12.15,51.20,12.62,51.48
    steps:
      - uses: actions/checkout@v4
      - name: osmium installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Ampeln laden (Geofabrik, BBBike oder Overpass)
        run: bash tools/fetch_signals.sh
      - name: Committen, wenn sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          if [ -f cameras.json ]; then git add cameras.json; fi
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Ampeldaten Leipzig aktualisiert"
          git push
